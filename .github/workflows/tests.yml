name: Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fresh-environment:
    name: fresh-environment (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Preflight without installed Forge dependencies
        run: python scripts/setup.py check --python "$(python -c 'import sys; print(sys.executable)')"
      - name: Bootstrap a fresh environment and run checks
        run: python scripts/setup.py install --python "$(python -c 'import sys; print(sys.executable)')"
      - name: Verify safe repeat
        run: |
          printf 'preserve\n' > .venv/installer-repeat-sentinel
          python scripts/setup.py install --python "$(python -c 'import sys; print(sys.executable)')"
          test "$(cat .venv/installer-repeat-sentinel)" = preserve
  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install pinned dependencies and package
        run: |
          python -m pip install -r requirements-mcp.lock
          python -m pip install --no-deps -e .
          python -m pip check
      - name: Run regression tests
        run: python -m pytest -q
      - name: Verify standalone agent-core installation
        run: |
          python -m venv /tmp/agent-core-check
          /tmp/agent-core-check/bin/python -m pip install --no-deps ./packages/agent-core
          /tmp/agent-core-check/bin/python packages/agent-core/examples/peer_handoff.py
          /tmp/agent-core-check/bin/python -m forge_agent_core.health --agent jarvis --instance primary --snapshot /tmp/agent-health-missing --require data
          /tmp/agent-core-check/bin/python -m forge_agent_core.telemetry --target jarvis primary /tmp/agent-health-missing
